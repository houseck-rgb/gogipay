<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>고기야 직원 연습</title>
<style>
:root{--brown:#2b2118;--gold:#e3c46b;--green:#1f7a46;--red:#ff1744;--cream:#faf6ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);font-family:-apple-system,"Noto Sans KR",sans-serif;color:var(--brown);overflow:hidden}
button{font-family:inherit;cursor:pointer}
/* 처음 화면: 연습 목록 */
#home{position:fixed;inset:0;overflow:auto;padding:22px 16px 40px}
#home .brand{font-family:Georgia,serif;letter-spacing:3px;color:#b08d2e;font-weight:700;font-size:15px;text-align:center}
#home h1{font-size:30px;text-align:center;margin:6px 0 2px}
#home .sub{text-align:center;color:#8a7258;font-weight:700;margin:0 0 18px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;max-width:980px;margin:auto}
.ls{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid #efe6d6;border-radius:18px;padding:16px;text-align:left;font-size:19px;font-weight:800;color:var(--brown)}
.ls i{flex:none;width:52px;height:52px;border-radius:16px;background:#f4ead8;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:26px}
.ls small{display:block;font-size:13px;color:#8a7258;font-weight:600;margin-top:2px}
.ls.done{border-color:#9bd3b0;background:#f1faf4}.ls.done i{background:var(--green);color:#fff;font-weight:900}
.ls{min-height:86px}.ls:active{transform:scale(.98)}
#allBtn{display:block;margin:18px auto 0;background:var(--green);color:#fff;border:0;border-radius:16px;padding:16px 30px;font-size:20px;font-weight:900}
/* 연습 화면 */
#play{position:fixed;inset:0;display:none;flex-direction:column}
#bar{flex:none;background:var(--brown);color:#fff;padding:10px 14px 12px;display:flex;align-items:center;gap:12px;z-index:3}
#bar .home{flex:none;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:800}
#bar .tx{flex:1;min-width:0}
#bar .tt{font-size:13px;color:var(--gold);font-weight:800}
#bar .st{font-size:21px;font-weight:900;line-height:1.3}
#bar .st b{color:#ffd54f}
#bar .cnt{flex:none;font-size:14px;font-weight:800;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 11px}
#bar .skip{flex:none;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:8px 10px;font-size:13px}
#stage{position:relative;flex:1;min-height:0}
#app{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#cover{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* 손가락 */
#ring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:4px solid var(--red);opacity:0;display:none}
#hand{position:absolute;font-size:58px;line-height:1;display:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));transform-origin:30% 0}
#hand.tap{animation:tap 1.2s ease-in-out infinite}
#ring.tap{animation:ring 1.2s ease-out infinite}
@keyframes tap{0%,100%{transform:translate(0,14px)}40%{transform:translate(0,0)}55%{transform:translate(0,0) scale(.92)}70%{transform:translate(0,14px)}}
@keyframes ring{0%,38%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
#hand.hold{animation:hold 2.2s ease-in-out infinite}
#ring.hold{animation:ringh 2.2s linear infinite}
@keyframes hold{0%{transform:translate(0,16px)}15%,85%{transform:translate(0,0) scale(.92)}100%{transform:translate(0,16px)}}
@keyframes ringh{0%,14%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(.6)}85%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1.4)}}
#tag{position:absolute;display:none;background:var(--red);color:#fff;font-weight:900;font-size:18px;padding:6px 12px;border-radius:12px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#good{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(.6);background:var(--green);color:#fff;font-size:30px;font-weight:900;padding:22px 34px;border-radius:24px;opacity:0;pointer-events:none;transition:.25s;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#good.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#fin{position:fixed;inset:0;background:rgba(43,33,24,.82);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#fin .box{background:#fff;border-radius:24px;padding:28px 24px;text-align:center;max-width:420px;width:100%}
#fin .ok{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:50px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
#fin h2{margin:6px 0;font-size:26px}#fin p{color:#8a7258;font-weight:700;margin:0 0 18px}
#fin .row{display:flex;gap:10px}#fin .row button{flex:1;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:900}
#fin .again{background:#f1ebe0;color:var(--brown)}#fin .next{background:var(--green);color:#fff}
@media(max-width:600px){#bar .st{font-size:17px}#bar .cnt{display:none}#hand{font-size:46px}}
</style>
</head>
<body>
<section id="home">
  <div class="brand">CHOI WOO YOUNG GOGIYA</div>
  <h1>무엇을 배울까요?</h1>
  <p class="sub">배울 것을 고르면 손가락이 하나씩 알려줘요 · 실제 주문은 들어가지 않아요</p>
  <div id="list"></div>
  <button id="allBtn">처음부터 전부 연습하기</button>
</section>

<section id="play">
  <div id="bar"><button class="home" id="homeBtn">☰ 목록</button><div class="tx"><div class="tt" id="tt"></div><div class="st" id="st"></div></div><span class="cnt" id="cnt"></span><button class="skip" id="skipBtn">건너뛰기</button></div>
  <div id="stage"><iframe id="app" title="연습 화면"></iframe><div id="cover"><div id="ring"></div><div id="hand">👆</div><div id="tag"></div></div></div>
</section>
<div id="good">✓ 잘했어요!</div>
<div id="fin"><div class="box"><div class="ok">✓</div><h2 id="finT"></h2><p id="finP">연습 완료!</p><div class="row"><button class="again" id="againBtn">다시 하기</button><button class="next" id="nextBtn">다음 연습 →</button></div></div></div>

<script>
/* ===== 연습용 손님 주문 데이터 (실제 매장과 무관) ===== */
const SEED={tables:{3:{items:{'grill-1':1,'meat-3':2,'liquor-0':1},ts:1},6:{items:{'meat-1':1},ts:1},2:{items:{'meat-0':2,'meat-1':1,'set-2':1,'liquor-0':3},ts:1},9:{items:{'set-0':2,'drink-0':1},ts:1},10:{items:{'meat-4':3},ts:1},12:{items:{'set-3':2},ts:1}}};
function seed(){const P='gogiya_practice_';try{Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>localStorage.removeItem(k));
  const now=Date.now();
  localStorage.setItem(P+'tables',JSON.stringify(SEED.tables));
  localStorage.setItem(P+'history',JSON.stringify([{table:3,lines:[{name:'BBQ 제육볶음 200그람',qty:1}],isAdd:true,ts:now-600000},{table:3,lines:[{name:'찹쌀떡구이 1개',qty:1},{name:'참이슬후레쉬',qty:1}],isAdd:false,ts:now-2400000},{table:2,lines:[{name:'BBQ 소살치살 150그람',qty:2}],isAdd:false,ts:now-1800000}]));}catch(e){}}

/* ===== 도우미 ===== */
let W=null,D=null; // 연습 화면(iframe)의 window / document
const q=s=>D&&D.querySelector(s);
const E=c=>{try{return W.eval(c);}catch(e){return undefined;}};
const chip=t=>D&&[...D.querySelectorAll('.headBtns .chip')].find(e=>e.textContent.includes(t));
const btn=t=>D&&[...D.querySelectorAll('#modalRoot button')].find(b=>b.textContent.trim()===t);
const listOn=()=>q('#listView')&&!q('#listView').classList.contains('hidden');
const qty=n=>E(`sumMap(tItems(${n})).q`)||0, pend=n=>E(`sumMap(pItems(${n})).q`)||0;
const dots=()=>D?D.querySelectorAll('#decoyPin .dpDots i.f').length:0;

/* ===== 연습 목록: 매뉴얼 순서 ===== */
const L=[
{t:'테이블 목록 보는 법',d:'빛나는 카드 = 주문 있는 테이블',s:[
  {x:'<b>빛나는 카드</b>는 손님 주문이 있는 테이블이에요. <b>3번</b>을 눌러 보세요',el:()=>q('.tCard[data-n="3"]'),ok:()=>E('curTable')===3},
]},
{t:'손님 주문 도와주기',d:'사진 → 주문하러 가기 → 주문하기',s:[
  {x:'빈 테이블 <b>5번</b>을 누르세요',el:()=>q('.tCard[data-n="5"]'),ok:()=>E('curTable')===5},
  {x:'먹고 싶은 <b>메뉴 사진</b>을 누르세요',el:()=>q('.mCard[data-id="set-0"]'),ok:()=>pend(5)>0},
  {x:'왼쪽 아래 <b>[주문하러 가기]</b>를 누르세요',el:()=>q('#cartBtn'),ok:()=>!!q('#cartOverlay')},
  {x:'메뉴·수량 확인 후 초록색 <b>[주문하기]</b>!',el:()=>q('.bigOrder:not([disabled])'),ok:()=>qty(5)>0&&pend(5)===0},
]},
{t:'새 주문 알림이 오면',d:'확인 누르기',setup:()=>setTimeout(()=>E(`showOrderAlert({table:5,isAdd:false,newJ:true,lines:[{name:'BBQ 소살치살 150그람',qty:2},{name:'카스',qty:1}],_ts:Date.now()},'p1',true)`),400),s:[
  {x:'새 주문이 왔어요! 음식 준비를 챙겼으면 <b>[확인]</b>',el:()=>q('.oAlert .x'),ok:()=>{if(q('.oAlert'))S.al=1;return !!S.al&&!q('.oAlert');}},
]},
{t:'주문 시간 확인',d:'미처리 · 추가 주문 보기',s:[
  {x:'위쪽 <b>[⏱ 주문 시간]</b>을 누르세요',el:()=>chip('주문 시간'),ok:()=>!!q('#otOverlay')},
  {x:'<b>[미처리]</b> 탭을 눌러 보세요',el:()=>q('#otTabs [data-k="todo"]'),ok:()=>E('_otTab')==='todo'},
  {x:'다 봤으면 <b>×</b>로 닫기',el:()=>q('#otOverlay .xBtn'),ok:()=>!q('#otOverlay')},
]},
{t:'테이블 이동 · 합치기',d:'6번 손님 → 7번으로',s:[
  {x:'위쪽 <b>[↔ 테이블 이동]</b>을 누르세요',el:()=>chip('테이블 이동'),ok:()=>!!q('#modalRoot .pkCard')},
  {x:'<b>보내는</b> 테이블 <b>6번</b>을 누르세요',el:()=>q('#modalRoot .pkCard[data-n="6"]'),ok:()=>!!(q('#modalRoot h3')&&q('#modalRoot h3').textContent.includes('6번 →'))},
  {x:'<b>받는</b> 테이블 <b>7번</b>을 누르세요',el:()=>q('#modalRoot .pkCard[data-n="7"]'),ok:()=>!!btn('이동')},
  {x:'<b>[이동]</b>을 누르면 끝!',el:()=>btn('이동'),ok:()=>qty(7)>0&&qty(6)===0},
]},
{t:'단체 묶기',d:'9번 + 10번 합계 한 번에',s:[
  {x:'위쪽 <b>[🔗 단체 묶기]</b>를 누르세요',el:()=>chip('단체 묶기'),ok:()=>!!q('#modalRoot .pkCard')},
  {x:'같이 온 <b>9번</b>을 누르세요',el:()=>q('#modalRoot .pkCard[data-n="9"]'),ok:()=>!!q('#modalRoot .pkCard[data-n="9"].sel')},
  {x:'<b>10번</b>도 누르세요',el:()=>q('#modalRoot .pkCard[data-n="10"]'),ok:()=>!!q('#modalRoot .pkCard[data-n="10"].sel')},
  {x:'<b>[단체로 묶기]</b>를 누르세요',el:()=>q('#modalRoot [data-ok]'),ok:()=>E('groups.length')>0},
  {x:'위에 <b>합계</b>가 보여요. 끝나면 <b>[해제]</b>',el:()=>q('#groupBar [data-gx]'),ok:()=>!!btn('묶음 해제')},
  {x:'<b>[묶음 해제]</b>를 누르세요',el:()=>btn('묶음 해제'),ok:()=>E('groups.length')===0},
]},
{t:'영수증 다시 뽑기',d:'테이블 재출력',s:[
  {x:'위쪽 <b>[🖨 테이블 재출력]</b>을 누르세요',el:()=>chip('재출력'),ok:()=>!!q('#modalRoot .pkCard')},
  {x:'다시 뽑을 <b>3번</b>을 누르세요',el:()=>q('#modalRoot .pkCard[data-n="3"]'),ok:()=>!q('#modalRoot .pkCard')&&!!q('#notice.show')},
]},
{t:'계산 후 테이블 비우기',d:'꾹 누르기 → 비우기',s:[
  {x:'계산 끝난 <b>6번</b>을 <b>꾹~</b> 누르세요',el:()=>q('.tCard[data-n="6"]'),hold:true,ok:()=>!!btn('테이블 비우기')},
  {x:'<b>[테이블 비우기]</b>를 누르세요',el:()=>btn('테이블 비우기'),ok:()=>qty(6)===0},
]},
{t:'전체 테이블로 가는 법',d:'로고 → 번호 3개 → 꾹',setup:()=>setTimeout(()=>E('openTable(12)'),300),s:[
  {x:'왼쪽 위 <b>금색 로고</b>를 한 번 터치',el:()=>q('#goldLogo'),ok:()=>!!q('#decoyPin')},
  {x:'<b>아무 번호</b>나 누르세요 (1/3)',el:()=>q('#decoyPin button[data-k="1"]'),ok:()=>dots()>=1},
  {x:'한 번 더 (2/3)',el:()=>q('#decoyPin button[data-k="2"]'),ok:()=>dots()>=2},
  {x:'한 번 더 (3/3)',el:()=>q('#decoyPin button[data-k="3"]'),ok:()=>dots()>=3},
  {x:'숫자 하나를 <b>꾹~</b> 누르면 전체 테이블',el:()=>q('#decoyPin button[data-k="5"]'),hold:true,ok:()=>listOn()},
]},
];

const ICON=['🗺️','🛒','🔔','⏱','↔','🔗','🖨','🧹','🔑'];
/* ===== 진행 ===== */
const $=id=>document.getElementById(id);
let li=0,si=0,timer=null,chain=false,lastEl=null,S={};
const done=new Set((()=>{try{return JSON.parse(localStorage.getItem('gogiya_practice_done')||'[]')}catch(e){return []}})());
function saveDone(){try{localStorage.setItem('gogiya_practice_done',JSON.stringify([...done]))}catch(e){}}
function home(){clearInterval(timer);$('play').style.display='none';$('home').style.display='block';$('fin').style.display='none';
  $('list').innerHTML=L.map((l,i)=>`<button class="ls${done.has(i)?' done':''}" data-i="${i}"><i>${done.has(i)?'✓':ICON[i]}</i><span>${l.t}<small>${l.d}</small></span></button>`).join('');}
$('list').onclick=e=>{const b=e.target.closest('[data-i]');if(b){chain=false;start(+b.dataset.i);}};
$('allBtn').onclick=()=>{chain=true;start(0);};
$('homeBtn').onclick=home;
$('skipBtn').onclick=()=>next();
$('againBtn').onclick=()=>start(li);
$('nextBtn').onclick=()=>{li+1<L.length?start(li+1):home();};

function start(i){li=i;si=0;lastEl=null;S={};clearInterval(timer);seed();
  $('home').style.display='none';$('fin').style.display='none';$('play').style.display='flex';
  $('tt').textContent=`${i+1}. ${L[i].t}`;$('st').innerHTML='불러오는 중…';$('cnt').textContent='';hideHand();
  const f=$('app');f.onload=()=>{W=f.contentWindow;D=f.contentDocument;
    // 연습 화면 안에서 다른 페이지로 나가지 않게
    try{W.open=()=>null;}catch(e){}
    if(L[i].setup)L[i].setup();setTimeout(show,500);timer=setInterval(tick,150);};
  clearTimeout(start._w);start._w=setTimeout(()=>{let okL=false;try{okL=!!(f.contentDocument&&f.contentDocument.getElementById('listView'));}catch(e){}
    if(!okL)$('st').innerHTML='연습 화면을 열 수 없어요. <b>gogipay.vercel.app/practice.html</b> 주소로 열어 주세요';},7000);
  f.src='index.html?practice=1&t='+Date.now();}
function show(){const st=L[li].s[si];$('st').innerHTML=st.x;$('cnt').textContent=`${si+1} / ${L[li].s.length}`;lastEl=null;}
function next(){si++;if(si>=L[li].s.length){finish();return;}show();}
function finish(){clearInterval(timer);hideHand();done.add(li);saveDone();
  $('finT').textContent=L[li].t;$('finP').textContent=li+1<L.length?'연습 완료! 다음으로 넘어갈까요?':'모든 연습을 끝냈어요! 👏';
  $('nextBtn').textContent=li+1<L.length?'다음 연습 →':'목록으로';$('fin').style.display='flex';}
let busy=false;
function tick(){if(!D||busy)return;const st=L[li].s[si];if(!st)return;
  if(st.ok()){busy=true;hideHand();$('good').classList.add('show');setTimeout(()=>{$('good').classList.remove('show');busy=false;next();},700);return;}
  const el=st.el();if(!el){hideHand();return;}
  if(el!==lastEl){lastEl=el;const r=el.getBoundingClientRect();if(r.top<0||r.bottom>W.innerHeight)el.scrollIntoView({block:'center'});}
  placeHand(el,st.hold);}
function placeHand(el,hold){const r=el.getBoundingClientRect(),fr=$('app').getBoundingClientRect(),sg=$('stage').getBoundingClientRect();
  const cx=fr.left-sg.left+r.left+r.width/2,cy=fr.top-sg.top+r.top+Math.min(r.height/2,60);
  const h=$('hand'),g=$('ring'),t=$('tag');const k=hold?'hold':'tap';
  h.className=k;g.className=k;h.style.display=g.style.display='block';
  h.style.left=(cx-16)+'px';h.style.top=(cy-4)+'px';g.style.left=cx+'px';g.style.top=cy+'px';
  t.style.display='block';t.textContent=hold?'꾹~ 누르기':'누르기';
  const tw=t.offsetWidth,sw=$('stage').clientWidth;t.style.left=Math.max(6,Math.min(sw-tw-6,cx+30))+'px';t.style.top=Math.max(6,cy-48)+'px';}
function hideHand(){['hand','ring','tag'].forEach(i=>$(i).style.display='none');}
addEventListener('resize',()=>{lastEl=null;});
home();
</script>
</body>
</html>
